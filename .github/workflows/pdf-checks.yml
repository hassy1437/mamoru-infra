# 帳票PDFの検査を CI で走らせる。
#
# ■ フックとCIで別の失敗モードを塞ぐ
#     フック（6.9秒） … 「壊れたまま push する」。速いので --no-verify の動機が出ない
#     CI（このファイル）… 「その端末では通ったが他では通らない」
#   ★同じ静的検査が両方で走るのは冗長ではない。フックは --no-verify でバイパスでき、
#     npm install を踏まない経路もある。CI が**バイパス経路を塞ぐ**。
#
# ■ ベースライン照合だけ外す（--skip-baseline）
#   登録済みPNGとの画素比較で、差分が出たら**人が目で見て承認する**検査。
#   CI に載せると「赤いまま放置」か「無条件更新」になり、判断が消えて儀式だけが残る。
#   ★技術的な制約ではない。Linux と Windows で描画は 132ページすべて1ピクセルも
#     違わないことを実測済み（render-probe.yml）。載せないのは運用上の判断。
#   やり忘れは pre-push フックの鮮度ゲートが止める。
#
# ■ 依存（実測）
#   Node ＋ Python ＋ PyMuPDF だけ。LibreOffice も Docker も要らない。
#
# ■ 3 台に分けて同時に流す（2026-10-23）
#   1 台（4 コア）では帳票PDF検査だけで 6〜11 分かかっていた。仕事の総量（約 1,150 秒）で時間が決まり、
#   同時実行数を増やしても縮まらない（並列の相はすでに CPU を使い切っている）。
#     build  … 型検査とビルド（PDF検査と同時に流す）
#     pdf    … 帳票PDF検査を 3 台に分けて流す（scripts/check-pdf-all.mjs --shard k/3）
#     checks … まとめ。★3 台の記録を突き合わせ、全部の検査がちょうど 1 台で流れたことを確かめる
#   ★台の数を変えるときは、matrix の shard と --shard の「/3」の両方を変える。
#     片方だけ変えると、まとめの突き合わせ（--verify-shards）が「台が欠けている」で落ちる（＝気づける）。
name: pdf-checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 型検査とビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # ★型検査とビルドも見る。検査スクリプトが緑でも、
      #   ルートがコンパイルできなければ本番で 500 になる
      #   （実際 next/font/google の外部依存でビルドが壊れた前例がある）。
      - name: 型検査
        run: npx tsc --noEmit

      - name: ビルド
        # ★ダミーの環境変数を置く。接続しないので実際の値は不要で、
        #   静的生成時に Supabase クライアントを組み立てられれば通る。
        #   .invalid は RFC 2606 で予約されたTLDで **DNS上に実在し得ない**ため、
        #   本物と取り違えられない。キーも一目で偽物と分かる文字列にする。
        #   ★本物を Secrets に移さないこと。接続しないのだから置く理由が無く、
        #     「必要ないものを置かない」のが一番安全。
        #   ★もしこれでビルドが落ちたら、それは回避対象ではなく**発見**。
        #     静的生成が実データを取りに行っている＝外部サービスの可用性に
        #     依存しているということなので、本物を入れて通すのではなく報告する。
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-dummy.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-not-a-real-key
        run: npm run build

  pdf:
    name: 帳票PDF検査 (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # ★1 台が落ちても他の台は最後まで流す（どの検査が落ちたかを全部見せる）
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # ★依存は requirements.txt を正とする。個別に列挙すると取りこぼす
      #   （「PyMuPDF だけ」と書いて 42件中15件が numpy 不足で落ちた）。
      #   scripts/check-python-deps.py が実際の import と突き合わせて守る。
      - run: pip install -r requirements.txt
      - run: npm ci

      # ★--regen 付き。CI にはリポジトリの内容しか無いので、生成物を必ず作り直す。
      #   ローカルの tmp/ に依存していると「その端末でしか通らない」を見逃す。
      # ★同時実行数は CPU の数そのまま。既定は「CPU 数 − 1」で、手元の端末を重くしないための余り。
      #   CI ではこの入口のほかに何も動かず、親は子を待つだけなので、1 つ空けておく理由が無い。
      # ★--report に「どの検査を受け持ち、どう終わったか」を書く（まとめの段が突き合わせる）
      - name: 帳票PDF検査（ベースライン照合を除く・この台の受け持ち）
        run: CHECK_PDF_CONCURRENCY=$(nproc) node scripts/check-pdf-all.mjs --regen --skip-baseline --shard ${{ matrix.shard }}/3 --report tmp/pdf-shard.json

      - name: この台の記録
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pdf-shard-${{ matrix.shard }}
          path: tmp/pdf-shard.json
          retention-days: 7

      # 落ちたときに現物を見られるようにする（画素差はローカルで確認する）
      - name: 生成物
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: generated-pdfs-${{ matrix.shard }}
          path: |
            tmp/pdf-realistic/*.pdf
            tmp/pdf-test-extra/*.pdf
          retention-days: 7

  # ★まとめ。以前の 1 つのジョブと同じ名前（checks）にしてある。
  #   ★if: always() … 前の段が落ちたときに「飛ばされた（＝通った扱い）」にしない。必ず走って落ちる。
  checks:
    name: checks
    needs: [build, pdf]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 型検査・ビルドと 3 台がすべて通ったか
        run: |
          echo "型検査とビルド: ${{ needs.build.result }} / 帳票PDF検査: ${{ needs.pdf.result }}"
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.pdf.result }}" != "success" ]; then
            echo "★通っていない段があります（上の結果を見てください）"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          # ★setup-node v5 以降は、cache を書かなくても条件しだいで npm のキャッシュを自動で使う
          #   （package.json に packageManager を書いたときなど）。ここは npm ci を
          #   しないので要らない（使うと保存・復元の時間だけ増える）。今までどおり使わない
          package-manager-cache: false

      - name: 台の記録を集める
        uses: actions/download-artifact@v8
        with:
          pattern: pdf-shard-*
          path: tmp/pdf-shards

      # ★全部の検査が、ちょうど 1 台で流れて通ったか（どこでも流れなかった検査が無いか）
      - name: 台の記録の突き合わせ
        run: node scripts/check-pdf-all.mjs --verify-shards tmp/pdf-shards
